{% extends "base.html" %}

{% block content %}
<div class="container py-5">
    <div class="row mb-5">
        <div class="col-12" style="writing-mode: horizontal-tb;">
            <h1 class="font-outfit fw-bold mb-3" style="color: var(--bs-body-color);">Theme Settings</h1>
            <p class="text-secondary" style="font-family: 'Plus Jakarta Sans', sans-serif;">Select the primary color
                theme for the EduLearn platform. This will immediately update the appearance for all users.</p>
        </div>
    </div>

    <div class="card glass border-0 shadow-lg p-lg-5 p-4 rounded-4" style="writing-mode: horizontal-tb;">
        <form action="{{ url_for('admin_theme') }}" method="POST">
            <h3 class="font-outfit fw-bold mb-4" style="color: var(--bs-body-color);">Available Themes</h3>

            <div class="row g-4 mb-5">
                {% for theme in themes %}
                <div class="col-md-6 col-lg-3">
                    <label class="w-100 cursor-pointer theme-select-card" style="writing-mode: horizontal-tb;">
                        <input type="radio" name="theme" value="{{ theme.id }}" class="d-none" {% if
                            current_theme==theme.id %}checked{% endif %}>
                        <div class="card h-100 border-2 transition-all p-3 rounded-4 
                                    {% if current_theme == theme.id %}border-primary bg-primary bg-opacity-10{% else %}border-secondary border-opacity-25 bg-transparent{% endif %}
                                    hover-border-primary" style="cursor: pointer; transition: all 0.2s ease;">

                            <!-- Theme Preview Bubbles -->
                            <div class="d-flex gap-2 mb-3">
                                {% for color in theme.colors %}
                                <div class="rounded-circle shadow-sm"
                                    style="width: 32px; height: 32px; background-color: {{ color }}; border: 1px solid rgba(255,255,255,0.2);">
                                </div>
                                {% endfor %}
                            </div>

                            <h5 class="fw-bold mb-0 font-outfit" style="color: var(--bs-body-color);">{{ theme.name }}
                            </h5>

                            <!-- Checkmark indicator -->
                            <div
                                class="position-absolute top-0 end-0 p-3 indicator-check {% if current_theme != theme.id %}d-none{% endif %}">
                                <span class="badge bg-primary rounded-circle p-2 shadow">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="white"
                                        viewBox="0 0 16 16">
                                        <path
                                            d="M10.97 4.97a.75.75 0 0 1 1.07 1.05l-3.99 4.99a.75.75 0 0 1-1.08.02L4.324 8.384a.75.75 0 1 1 1.06-1.06l2.094 2.093 3.473-4.425a.267.267 0 0 1 .02-.022z" />
                                    </svg>
                                </span>
                            </div>

                        </div>
                    </label>
                </div>
                {% endfor %}
            </div>

            <div class="d-flex justify-content-end">
                <button type="submit" class="btn btn-primary btn-lg px-5 rounded-pill shadow font-outfit fw-bold"
                    style="transform: none !important;">
                    Save Global Theme
                </button>
            </div>
        </form>
    </div>
</div>

<style>
    /* Local styles for theme selector interactivity */
    .theme-select-card input:checked+.card {
        border-color: var(--primary, #3b82f6) !important;
        background-color: color-mix(in srgb, var(--primary, #3b82f6) 10%, transparent) !important;
    }

    .theme-select-card input:checked+.card .indicator-check {
        display: block !important;
    }

    .hover-border-primary:hover {
        border-color: var(--primary, #3b82f6) !important;
        transform: translateY(-2px);
        box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
    }

    .font-outfit {
        font-family: 'Outfit', system-ui, sans-serif !important;
    }
</style>

<script>
    // Simple script to toggle visual state of cards when clicking radio buttons
    document.querySelectorAll('.theme-select-card input').forEach(input => {
        input.addEventListener('change', function () {
            // Reset all cards
            document.querySelectorAll('.theme-select-card .card').forEach(card => {
                card.classList.remove('border-primary', 'bg-primary', 'bg-opacity-10');
                card.classList.add('border-secondary', 'border-opacity-25', 'bg-transparent');
                card.querySelector('.indicator-check').classList.add('d-none');
            });

            // Highlight selected
            if (this.checked) {
                const card = this.nextElementSibling;
                card.classList.remove('border-secondary', 'border-opacity-25', 'bg-transparent');
                card.classList.add('border-primary', 'bg-primary', 'bg-opacity-10');
                card.querySelector('.indicator-check').classList.remove('d-none');
            }
        });
    });
</script>
{% endblock %}
