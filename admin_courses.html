{% extends "base.html" %}
{% block content %}
<section class="container py-5">
  <div class="d-flex align-items-center justify-content-between mb-3">
    <h2 class="fw-bold">Admin: All Courses</h2>
    <a href="{{ url_for('instructor_course_new', back=url_for('admin_courses')) }}" class="btn btn-primary rounded-pill">+ New Course</a>
  </div>

  {% if courses %}
  <div class="row g-4">
    {% for c in courses %}
    <div class="col-md-6 col-lg-4">
      <div class="course-card h-100 pop-card">
        <div class="ratio ratio-16x9"><img src="{{ c.thumbnail }}" class="object-cover rounded-top-4" alt=""></div>
        <div class="p-3">
          <h5 class="mb-1">{{ c.title }}</h5>
          <div class="small text-secondary mb-1">Instructor: {{ c.instructor }}</div>
          <div class="small text-secondary mb-2">{{ c.short_desc }}</div>
          <div class="d-flex gap-2">
            <a href="{{ url_for('instructor_course_edit', cid=c.id, back=url_for('admin_courses')) }}" class="btn btn-outline-primary btn-sm">Edit</a>
            <a href="{{ url_for('instructor_lessons', cid=c.id, back=url_for('admin_courses')) }}" class="btn btn-outline-secondary btn-sm">Manage Lessons</a>
            <a href="{{ url_for('instructor_quizzes', cid=c.id, back=url_for('admin_courses')) }}" class="btn btn-outline-secondary btn-sm">Manage Quizzes</a>
            <form class="ms-auto" method="post" action="{{ url_for('instructor_course_delete', cid=c.id, back=url_for('admin_courses')) }}" onsubmit="return confirm('Delete course {{ c.title }}?');">
              <button class="btn btn-outline-secondary btn-sm">Delete</button>
            </form>
          </div>
        </div>
      </div>
    </div>
    {% endfor %}
  </div>
  {% else %}
    <div class="card glass p-4"><div class="text-secondary">No courses yet.</div></div>
  {% endif %}
</section>
{% endblock %}
