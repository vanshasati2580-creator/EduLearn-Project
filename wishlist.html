{% extends "base.html" %}
{% block content %}
<section class="container py-5">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h2 class="fw-bold mb-0">Your Wishlist</h2>
    <a href="{{ url_for('index') }}" class="btn btn-sm btn-outline-primary rounded-pill">Browse Courses</a>
  </div>
  <div class="row g-4">
    {% for c in courses %}
      <div class="col-md-6 col-lg-4">
        <div class="course-card h-100 pop-card">
          <div class="ratio ratio-16x9"><img src="{{ c.thumbnail }}" class="object-cover rounded-top-4" alt=""></div>
          <div class="p-3">
            <h5 class="mb-1">{{ c.title }}</h5>
            <div class="small text-secondary">{{ c.instructor }}</div>
            <div class="mt-1"><span class="badge text-bg-secondary">${{ course_prices[c.id] }}</span></div>
            <div class="mt-2 d-flex gap-2 align-items-center">
              <a class="btn btn-sm btn-outline-primary rounded-pill" href="{{ url_for('course_detail', cid=c.id) }}">Details</a>
              <a class="btn btn-sm btn-success rounded-pill" href="{{ url_for('checkout', cid=c.id) }}">Buy ${{ course_prices[c.id] }}</a>
              <form method="post" action="{{ url_for('favorite_toggle', cid=c.id) }}">
                <button class="btn btn-sm btn-outline-secondary rounded-pill" title="Remove">♥ Remove</button>
              </form>
              <form method="post" action="{{ url_for('cart_add', cid=c.id) }}">
                <button class="btn btn-sm btn-outline-secondary rounded-pill">Add to Cart</button>
              </form>
            </div>
          </div>
        </div>
      </div>
    {% else %}
      <div class="col-12"><p class="text-secondary">Your wishlist is empty.</p></div>
    {% endfor %}
  </div>
</section>
{% endblock %}
